---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: silverblue
# description will be included in the image's metadata
description: This is my personal OS Fedora Silverblue image.

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora/fedora-silverblue
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
      nonfree: negativo17
    install:
      packages:
        - adw-gtk3-theme
        - alsa-firmware
        - distrobox
        - fdk-aac
        - ffmpeg
        - ffmpeg-libs
        - ffmpegthumbnailer
        - flatpak-spawn
        - fuse
        - fzf
        - grub2-tools-extra
        - gvfs-nfs
        - heif-pixbuf-loader
        - htop
        - ibus-mozc
        - ibus-unikey
        - just
        - libavcodec
        - libcamera
        - libcamera-gstreamer
        - libcamera-ipa
        - libheif
        - libcamera-tools
        - libfdk-aac
        - libimobiledevice-utils
        - libratbag-ratbagd
        - libva-utils
        - lshw
        - net-tools
        - nvme-cli
        - nvtop
        - openssl
        - pam-u2f
        - pam_yubico
        - pamu2fcfg
        - pipewire-libs-extra
        - pipewire-plugin-libcamera
        - powerstat
        - smartmontools
        - solaar
        - solaar-udev
        - squashfs-tools
        - symlinks
        - tcpdump
        - tmux
        - traceroute
        - usbmuxd
        - uupd
        - vim
        - wireguard-tools
        - wl-clipboard
        - xhost
        - xorg-x11-xauth
        - yubikey-manager
        - zstd
    remove:
      packages:
        - default-fonts-cjk-sans
        - fedora-third-party
        - gnome-software-rpm-ostree
        - google-noto-sans-cjk-vf-fonts
        - totem-video-thumbnailer

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          title: Flathub (system)

  - type: brew
    direct-pull: true
    nofile-limits: true
    brew-analytics: false

  - type: fonts
    fonts:
      nerd-fonts:
        - Iosevka
        - IosevkaTerm
        - IosevkaTermSlab
      url-fonts:
        - name: Iosevka
          url: https://github.com/be5invis/Iosevka/releases/tag/latest

  - type: script
    snippets:
      - 'sed -Ei "s/secure_path = (.*)/secure_path = \1:\/home\/linuxbrew\/.linuxbrew\/bin/" /etc/sudoers'
    scripts:
        - theming.sh

  - type: systemd
    system:
      enabled:
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
